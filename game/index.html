<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langit Nusantara — Island Courier</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2233; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Langit Nusantara, Island Courier: fly the plane through the glowing rings over the islands"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
